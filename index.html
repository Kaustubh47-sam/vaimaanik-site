<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAIMAANIK</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@500;600&family=Unbounded:wght@600&family=Fraunces:ital,wght@1,400&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{background:#000}
body{font-family:Rajdhani,sans-serif;color:#eaf4ff;overflow-x:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
section{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:0 7vw;pointer-events:none}
.s0{height:100vh;justify-content:flex-end;align-items:center;padding-bottom:7vh;text-align:center}
.s1,.s3,.s4{height:100vh}.s2{height:200vh;justify-content:flex-start;padding-top:12vh}.s4{align-items:center;text-align:center}
h2{font:900 clamp(26px,5vw,60px)/1.1 Orbitron,sans-serif;letter-spacing:.03em;text-shadow:0 0 30px rgba(76,201,255,.45)}
p{max-width:520px;font-size:clamp(17px,2vw,22px);opacity:.9;margin-top:14px;line-height:1.4}
.sr{position:absolute;left:-9999px}
.tag,.hint{opacity:0;transition:opacity 1.8s;font:500 13px Orbitron,sans-serif;letter-spacing:.28em}
.tag.on{opacity:.8}.hint.on{opacity:1;animation:bob 1.6s ease-in-out infinite}
.tag{position:absolute;top:12vh}
@keyframes bob{50%{transform:translateY(8px)}}
#brand{position:fixed;left:20px;top:16px;z-index:3;font:900 14px Orbitron,sans-serif;letter-spacing:.25em;pointer-events:none}
#hud{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:3;display:grid;gap:14px;text-align:right;font:500 12px Orbitron,sans-serif;pointer-events:none}
#hud small{display:block;opacity:.6;letter-spacing:.15em}#hud b{font-size:20px;color:#4cc9ff}
.bar{height:110px;width:3px;margin-left:auto;background:rgba(255,255,255,.2);position:relative}
#barf{position:absolute;bottom:0;left:0;width:100%;background:#ff8a3c}
#cards{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;pointer-events:auto}
.card{width:250px;padding:20px;border-radius:16px;background:rgba(6,10,36,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(76,201,255,.4)}
.card h3{font:900 18px Orbitron,sans-serif;color:#4cc9ff}.card p{font-size:16px;margin:8px 0 14px}
button{cursor:pointer;font:700 14px Orbitron,sans-serif;border:0;border-radius:12px;padding:14px 22px;color:#fff;letter-spacing:.06em;background:linear-gradient(90deg,#ff8a3c,#ff3d7f);pointer-events:auto;box-shadow:0 0 28px rgba(255,90,90,.45)}
.s4 button{margin-top:26px;font-size:17px;padding:18px 34px}
#tip{position:fixed;z-index:5;width:250px;padding:14px;border-radius:12px;background:rgba(5,12,32,.9);border:1px solid #4cc9ff;pointer-events:none;opacity:0;transition:opacity .15s}
#tip h4{font:900 15px Orbitron,sans-serif;color:#4cc9ff}#tip p{font-size:15px;margin-top:6px}
.mini{height:34px;margin-top:8px;position:relative;overflow:hidden}.mini::after{content:'';position:absolute}
.spin::after{left:50%;top:2px;width:30px;height:30px;margin-left:-15px;border:3px solid #4cc9ff;border-color:#4cc9ff transparent;border-radius:50%;animation:rot .5s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.sq::after{inset:0;background:repeating-linear-gradient(90deg,#4cc9ff 0 6px,transparent 6px 12px);transform-origin:left;animation:sq 1.1s ease-in-out infinite alternate}
@keyframes sq{to{transform:scaleX(.3)}}
.fire::after{left:50%;top:2px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(#fff,#ff8a3c 45%,transparent 70%);animation:fl .22s alternate infinite}
@keyframes fl{from{transform:scale(.7)}to{transform:scale(1.25)}}
.str::after{left:0;top:14px;width:100%;height:6px;background:repeating-linear-gradient(90deg,#ffa040 0 10px,transparent 10px 24px);animation:mv .4s linear infinite}
@keyframes mv{to{background-position:24px 0}}
@font-face{font-family:Samarkan;src:local('Samarkan'),url(Samarkan.ttf)}
#brand{font:400 26px Samarkan,'Cinzel Decorative',serif;letter-spacing:.08em;color:#fff}
.s1 h2{font:600 clamp(24px,4.4vw,54px)/1.15 Unbounded,sans-serif;letter-spacing:.02em}
.s1 p{font:italic 400 clamp(19px,2.2vw,26px)/1.5 Fraunces,serif;max-width:560px}
</style></head><body>
<canvas id="c"></canvas>
<div id="brand"></div>
<div id="hud"><div><small>altitude</small><b id="alt">0</b> km</div><div><small>speed</small><b id="spd">0</b> km/h</div><div><small>heading</small><b id="hdg">090</b>°</div><div class="bar"><span id="barf"></span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   1. CONFIG — edit everything here, no need to touch the rest
   ═══════════════════════════════════════════════════════════ */
const CONFIG={
  name:'VAIMAANIK',                              // title formed by the drones
  dept:'Department of Aeronautical Engineering',
  scrollHint:'Scroll to take off ↓',

  formUrl:'PASTE_YOUR_GOOGLE_FORM_LINK_HERE',    // default registration link
  newTab:false,                                  // true = open the form in a new tab
  redirectDelay:2400,                            // ms to show the boarding pass before redirecting

  about:{title:'Break through the clouds',text:'A flight of ideas, engineering and imagination. Replace this with your event description.'},
  engine:{title:'Anatomy of thrust',text:'Keep scrolling and the engine comes apart. Hover over any part to see what it does.'},

  eventsTitle:'Choose your mission',
  events:[                                       // form:'' uses formUrl above; paste a link to give an event its own form
    {name:'Event 1',desc:'Short description of the first event.',form:''},
    {name:'Event 2',desc:'Short description of the second event.',form:''},
    {name:'Event 3',desc:'Short description of the third event.',form:''}
  ],
  cardButton:'Register',

  register:{title:'Clear for takeoff',text:'Your seat is one tap away. This opens the registration form.',button:'Clear for takeoff ✈',label:'All events'},

  // visuals
  drones:620,        // drones in the title formation (fewer on phones automatically)
  flocks:4,          // flocks of birds
  flockSize:9,       // birds per flock
  bloom:{strength:.85,radius:.65,threshold:.85}
};

/* ═══════════════════════════════════════════════════════════
   2. HELPERS + DOM TEXT
   ═══════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),
ss=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)},lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
document.title=CONFIG.name+' · '+CONFIG.dept;
$('brand').textContent=$('h1').textContent=CONFIG.name;$('tag').textContent=CONFIG.dept;$('hint').textContent=CONFIG.scrollHint;
$('aT').innerHTML=CONFIG.about.title;$('aP').textContent=CONFIG.about.text;$('eT').textContent=CONFIG.engine.title;$('eP').textContent=CONFIG.engine.text;
$('vT').textContent=CONFIG.eventsTitle;$('rT').textContent=CONFIG.register.title;$('rP').textContent=CONFIG.register.text;$('go').textContent=CONFIG.register.button;
CONFIG.events.forEach(e=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h3></h3><p></p><button></button>';
  d.children[0].textContent=e.name;d.children[1].textContent=e.desc;d.children[2].textContent=CONFIG.cardButton;
  d.children[2].onclick=()=>register(e.form||CONFIG.formUrl,e.name);$('cards').appendChild(d)});
$('go').onclick=()=>register(CONFIG.formUrl,CONFIG.register.label);

/* ═══════════════════════════════════════════════════════════
   3. RENDERER, CAMERA, LIGHTS, BLOOM
   ═══════════════════════════════════════════════════════════ */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,3200);scene.add(cam);
scene.background=new THREE.Color();scene.fog=new THREE.Fog(0,60,700);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(5,8,6);scene.add(sun);
const key=new THREE.PointLight(0x88ccff,1,40);key.position.set(-3,3,2);cam.add(key);
let composer=null,bloomPass=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){composer=new THREE.EffectComposer(R);composer.addPass(new THREE.RenderPass(scene,cam));
  bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),CONFIG.bloom.strength,CONFIG.bloom.radius,CONFIG.bloom.threshold);composer.addPass(bloomPass)}
function glow(a,b){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}

/* ═══════════════════════════════════════════════════════════
   4. SKY — shader dome (gradient, sun, drifting clouds) + stars
   ═══════════════════════════════════════════════════════════ */
// [progress, top colour, horizon colour]  — edit these to restyle the whole journey
const SKY=[[0,0x000000,0x000000],[.1,0x000000,0x000000],[.28,0x000000,0x000000],[.55,0x000000,0x000000],[.8,0x000000,0x000000],[1,0x000000,0x000000]]
  .map(([t,a,b])=>[t,new THREE.Color(a),new THREE.Color(b)]);
const skyU={uTop:{value:new THREE.Color()},uHor:{value:new THREE.Color()},uSun:{value:new THREE.Vector3(-.4,.1,-.9)},uT:{value:0},uCl:{value:.8},uBr:{value:.4},uSt:{value:0},uTh:{value:.9945}};
const skyMesh=new THREE.Mesh(new THREE.SphereGeometry(2500,48,32),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform vec3 uTop,uHor,uSun;uniform float uT,uCl,uBr,uSt,uTh;varying vec3 vD;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
 float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
 void main(){
  vec3 d=normalize(vD);
  float lon=atan(d.z,d.x),lat=asin(clamp(d.y,-1.,1.));
  vec2 gal=vec2(lon,lat);
  float bandCenter=.13*sin(lon*1.15)-.035;
  float band=exp(-pow((lat-bandCenter)*3.05,2.));
  float dust=fbm(gal*vec2(18.,34.)+vec2(1.7,-.6))+.48*fbm(gal*vec2(46.,78.));
  float lanes=fbm(gal*vec2(92.,150.)+vec2(3.1,1.4));
  float milky=band*smoothstep(.20,.82,dust)*(.48+.75*lanes);
  vec3 c=mix(vec3(.0025,.0035,.009),vec3(.012,.012,.025),smoothstep(-.45,.55,d.y));
  c+=vec3(.055,.050,.095)*milky;
  c+=vec3(.026,.035,.075)*band*pow(dust,2.0);
  c-=vec3(.012,.012,.022)*band*smoothstep(.52,.78,lanes);
  vec2 grid=vec2(lon*980.,lat*610.);
  vec2 cell=floor(grid),local=fract(grid);
  float seed=h(cell),starSize=mix(.012,.045,h(cell+vec2(19.7,7.1)));
  vec2 starPos=vec2(h(cell+vec2(3.1,8.2)),h(cell+vec2(11.4,2.8)));
  float star=1.-smoothstep(starSize,starSize+.012,length(local-starPos));
  float chosen=step(uTh,seed);
  float bright=mix(.18,1.0,pow(h(cell+vec2(5.2,17.3)),5.));
  c+=vec3(.62,.69,.88)*star*chosen*bright*1.65;
  c+=vec3(.55,.65,1.)*exp(-length(local-starPos)*10.)*chosen*bright*.3;float warm=step(.9988,h(cell+vec2(41.3,13.7)))*star;
  c+=vec3(.95,.52,.28)*warm*.8;
  float horizon=exp(-pow((d.y+.085)*28.,2.));
  c+=vec3(.025,.010,.008)*horizon;
  gl_FragColor=vec4(c*uSt,1.);
 }`}));
skyMesh.renderOrder=-1;skyMesh.frustumCulled=false;scene.add(skyMesh);
function skyAt(p){let i=1;while(i<SKY.length-1&&p>SKY[i][0])i++;const a=SKY[i-1],b=SKY[i],k=clamp((p-a[0])/(b[0]-a[0]));
  skyU.uTop.value.copy(a[1]).lerp(b[1],k);skyU.uHor.value.copy(a[2]).lerp(b[2],k)}
const stp=new Float32Array(30000);for(let i=0;i<10000;i++){const u=rnd(-1,1),a=rnd(0,6.283),r=Math.sqrt(1-u*u);stp.set([r*Math.cos(a)*1500,u*1500,r*Math.sin(a)*1500],i*3)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(stp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:5,map:glow('#fff','rgba(150,190,255,0)'),color:0xcfe0ff,sizeAttenuation:false,transparent:true,opacity:0,blending:THREE.AdditiveBlending,fog:false,depthWrite:false}));stars.frustumCulled=false;scene.add(stars);

/* ═══════════════════════════════════════════════════════════
   5. WORLD — fly-through clouds, runway, Earth, birds
   ═══════════════════════════════════════════════════════════ */
const clouds=new THREE.Group(),ct=glow('rgba(255,255,255,.85)','rgba(255,255,255,0)');
for(let k=0;k<45;k++){const cx=rnd(-45,45),cy=rnd(4,62),cz=rnd(-560,-90);
  for(let j=0;j<4;j++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ct,transparent:true,depthWrite:false,opacity:.45}));
    s.position.set(cx+rnd(-15,15),cy+rnd(-4,4),cz+rnd(-10,10));s.scale.setScalar(rnd(25,55));clouds.add(s)}}
scene.add(clouds);

const gm=[],ground=new THREE.Group();scene.add(ground);
const rc=document.createElement('canvas');rc.width=64;rc.height=256;{const x=rc.getContext('2d');x.fillStyle='#14161d';x.fillRect(0,0,64,256);x.fillStyle='#e8e8e8';x.fillRect(30,20,4,90);x.fillRect(30,150,4,90);x.fillStyle='#777';x.fillRect(2,0,3,256);x.fillRect(59,0,3,256)}
const rt=new THREE.CanvasTexture(rc);rt.wrapT=THREE.RepeatWrapping;rt.repeat.set(1,30);
const rm=new THREE.MeshBasicMaterial({map:rt,transparent:true}),run=new THREE.Mesh(new THREE.PlaneGeometry(26,900),rm);run.rotation.x=-Math.PI/2;run.position.set(0,0,-420);
const gmat=new THREE.MeshBasicMaterial({color:0x07140e,transparent:true}),grass=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),gmat);grass.rotation.x=-Math.PI/2;grass.position.y=-.05;
const lp=[];for(let z=0;z>-420;z-=10)lp.push(-13.5,.3,z,13.5,.3,z);
const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
const lm=new THREE.PointsMaterial({size:3.5,map:glow('#fff','rgba(255,200,120,0)'),color:0xffc880,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
ground.add(grass,run,new THREE.Points(lg,lm));gm.push(rm,gmat,lm);

const NZ=`float h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fb(vec3 p){float a=.5,s=0.;for(int i=0;i<6;i++){s+=a*n3(p);p*=2.02;a*=.5;}return s;}`;
const eU={uO:{value:0},uT:{value:0},uL:{value:new THREE.Vector3(-.5,.1,-.4).normalize()}};
const em=new THREE.ShaderMaterial({uniforms:eU,transparent:true,fog:false,
 vertexShader:'varying vec3 vP,vN,vW;void main(){vP=normalize(position);vN=normalize(mat3(modelMatrix)*normal);vW=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:NZ+`uniform float uO,uT;uniform vec3 uL;varying vec3 vP,vN,vW;
 void main(){vec3 p=vP;float lc=fb(p*2.6+3.),land=smoothstep(.5,.54,lc+.18*fb(p*9.)),lat=abs(p.y),ice=smoothstep(.82,.9,lat+.05*fb(p*14.));
  float el=fb(p*7.+9.);vec3 sea=mix(vec3(.01,.05,.16),vec3(.02,.16,.34),smoothstep(.35,.55,lc));
  vec3 ter=mix(vec3(.08,.2,.06),vec3(.5,.4,.25),smoothstep(.45,.75,el));
  vec3 col=mix(mix(sea,ter,land),vec3(.93,.96,1.),ice);
  float cl=smoothstep(.5,.78,fb(p*4.2+vec3(uT*.01,0.,0.)));
  vec3 N=normalize(vN),V=normalize(cameraPosition-vW);float d=dot(N,uL),day=smoothstep(-.08,.25,d),fr=pow(1.-max(dot(N,V),0.),3.);
  vec3 lit=mix(col,vec3(1.),cl*.85)*(.05+1.15*max(d,0.));
  lit+=pow(max(dot(reflect(-uL,N),V),0.),40.)*(1.-land)*(1.-ice)*.7*vec3(.7,.85,1.)*day;
  float city=smoothstep(.62,.75,fb(p*38.))*land*(1.-ice)*(1.-cl*.8)*smoothstep(.1,-.2,d);
  gl_FragColor=vec4(lit+city*vec3(1.,.72,.35)*1.3+fr*vec3(.1,.3,.7)*(.4+.6*day),uO);}`});
const earth=new THREE.Mesh(new THREE.SphereGeometry(600,128,96),em);
const aU={uO:{value:0}},am=new THREE.ShaderMaterial({uniforms:aU,side:THREE.BackSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,
 vertexShader:'varying vec3 vN,vV;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'uniform float uO;varying vec3 vN,vV;void main(){float i=pow(clamp(1.+dot(vN,vV),0.,1.),4.);gl_FragColor=vec4(vec3(.3,.6,1.)*1.5,i*uO);}'});
const atm=new THREE.Mesh(new THREE.SphereGeometry(645,64,48),am);scene.add(earth,atm);

/* birds: flocks in V formation, wings flap */
const birds=new THREE.Group(),flocks=[];scene.add(birds);
{const bm=new THREE.MeshBasicMaterial({color:0x080810,side:THREE.DoubleSide,fog:false}),
  wR=new THREE.PlaneGeometry(.9,.4).rotateX(-Math.PI/2).translate(.45,0,0),wL=wR.clone().scale(-1,1,1),bodyG=new THREE.ConeGeometry(.08,.55,6).rotateX(-Math.PI/2);
  for(let f=0;f<CONFIG.flocks;f++){const fl={g:new THREE.Group(),dir:f%2?1:-1,spd:rnd(5,9),b:[]};
    fl.g.position.set(rnd(-80,80),rnd(8,42),-50-f*115-rnd(0,40));
    for(let i=0;i<CONFIG.flockSize;i++){const b=new THREE.Group(),r=Math.ceil(i/2),s=i%2?1:-1;
      b.position.set(-r*1.9*fl.dir,rnd(-.4,.4),s*r*1.7);b.rotation.y=fl.dir>0?-Math.PI/2:Math.PI/2;b.scale.setScalar(1.7);
      const a=new THREE.Mesh(wR,bm),c=new THREE.Mesh(wL,bm);b.add(a,c,new THREE.Mesh(bodyG,bm));b.userData={a,c,ph:rnd(0,6),sp:rnd(7,10)};fl.g.add(b);fl.b.push(b)}
    birds.add(fl.g);flocks.push(fl)}}
function updateBirds(t,dt){flocks.forEach(fl=>{fl.g.position.x+=fl.dir*fl.spd*dt;if(Math.abs(fl.g.position.x)>110)fl.g.position.x=-fl.dir*110;fl.g.position.y+=Math.sin(t*.5+fl.spd)*.01;
  fl.b.forEach(b=>{const u=b.userData,w=Math.sin(t*u.sp+u.ph)*.75;u.a.rotation.z=w;u.c.rotation.z=-w})})}

/* ═══════════════════════════════════════════════════════════
   6. DRONES — detailed hero drone + title formation swarm
   ═══════════════════════════════════════════════════════════ */
function buildDrone(){
